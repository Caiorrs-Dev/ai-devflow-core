name: Tests

# Required status check names: "Unit Tests" and "Security Rules Tests".
#
# No `paths-ignore` on the trigger: a workflow that does not run never reports
# its checks, so required checks would block docs-only PRs forever. Instead the
# `changes` job decides, and a job skipped by its `if` reports success.
on:
  pull_request:
    branches:
      - @@branches.production@@
      - @@branches.integration@@
  workflow_dispatch:

permissions:
  contents: read
  # dorny/paths-filter lists the PR files through the API.
  pull-requests: read

jobs:
  # Unit tests and security-rule tests have disjoint inputs. Outputs are
  # 'true'/'false'; consumers run on anything except 'false', so a failed
  # detection fails open (suites run) instead of silently skipping.
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    outputs:
      unit: ${{ steps.manual.outputs.unit || steps.filter.outputs.unit }}
      rules: ${{ steps.manual.outputs.rules || steps.filter.outputs.rules }}
    steps:
      # A manual run has no PR diff to filter against, so run every suite.
      - name: Force all suites on manual dispatch
        id: manual
        if: github.event_name == 'workflow_dispatch'
        run: |
          echo "unit=true" >> "$GITHUB_OUTPUT"
          echo "rules=true" >> "$GITHUB_OUTPUT"

      - name: Detect changed paths
        id: filter
        if: github.event_name != 'workflow_dispatch'
        uses: dorny/paths-filter@v3
        with:
          filters: |
            unit:
              - 'src/**'
              - 'functions/src/**'
              - 'functions/package*.json'
              - 'scripts/**'
              - 'package*.json'
              - 'vite.config.*'
              - 'vitest.*'
              - 'tsconfig*.json'
            rules:
              - 'firestore.rules'
              - 'storage.rules'
              - 'tests/rules/**'
              - 'vitest.rules.config.*'
              - 'firebase*.json'
              - 'package*.json'

  unit-tests:
    name: Unit Tests
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.unit != 'false' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          # `--changed HEAD^1` needs the PR base commit.
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: @@node.version@@
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # Add a step here that writes dummy VITE_* values to .env.local when the
      # app reads them at import time.

      - name: Run unit tests
        run: |
          if [ "${{ github.event_name }}" == "pull_request" ]; then
            npx vitest run --changed HEAD^1 --passWithNoTests
          else
            npx vitest run
          fi

  rules-tests:
    name: Security Rules Tests
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.rules != 'false' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: @@node.version@@
          cache: "npm"

      # The Firestore emulator in firebase-tools needs JDK 21+.
      - name: Setup Java (for the Firestore emulator)
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Install dependencies
        run: npm ci

      - name: Run security-rule tests (emulator)
        run: @@commands.testRules@@
