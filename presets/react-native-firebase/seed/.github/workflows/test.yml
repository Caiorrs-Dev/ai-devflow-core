name: Tests

# Required status check name: "Unit Tests". Jest runs the full suite: its
# changed-files mode needs a configured base and is easy to get wrong in CI.
#
# No `paths-ignore` on the trigger: a workflow that does not run never reports
# its check, so a required check would block docs-only PRs forever. Instead the
# `changes` job decides, and a job skipped by its `if` reports success.
on:
  pull_request:
    branches:
      - @@branches.production@@
      - @@branches.integration@@
  workflow_dispatch:

permissions:
  contents: read
  # dorny/paths-filter lists the PR files through the API.
  pull-requests: read

concurrency:
  group: tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      unit: ${{ steps.manual.outputs.unit || steps.filter.outputs.unit }}
    steps:
      - name: Force all suites on manual dispatch
        id: manual
        if: github.event_name == 'workflow_dispatch'
        run: echo "unit=true" >> "$GITHUB_OUTPUT"

      - name: Detect changed paths
        id: filter
        if: github.event_name != 'workflow_dispatch'
        uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3.0.4
        with:
          filters: |
            unit:
              @@ci.unitPaths@@

  unit-tests:
    name: Unit Tests
    needs: changes
    # Run unless detection said 'false': a failed detection fails open.
    if: ${{ !cancelled() && needs.changes.outputs.unit != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: @@node.version@@
          cache: "npm"

      - name: Install dependencies
        run: @@commands.install@@

      - name: Run unit tests
        run: @@commands.test@@
