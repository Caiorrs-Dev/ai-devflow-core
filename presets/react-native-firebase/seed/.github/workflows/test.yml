name: Tests

# Required status check names: "Unit Tests" and "Security Rules Tests".
on:
  pull_request:
    branches:
      - @@branches.production@@
      - @@branches.integration@@
  workflow_dispatch:

permissions:
  contents: read
  # dorny/paths-filter lists the PR files through the API.
  pull-requests: read

jobs:
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    outputs:
      unit: ${{ steps.manual.outputs.unit || steps.filter.outputs.unit }}
      rules: ${{ steps.manual.outputs.rules || steps.filter.outputs.rules }}
    steps:
      - name: Force all suites on manual dispatch
        id: manual
        if: github.event_name == 'workflow_dispatch'
        run: |
          echo "unit=true" >> "$GITHUB_OUTPUT"
          echo "rules=true" >> "$GITHUB_OUTPUT"

      - name: Detect changed paths
        id: filter
        if: github.event_name != 'workflow_dispatch'
        uses: dorny/paths-filter@v3
        with:
          filters: |
            unit:
              - 'src/**'
              - '__tests__/**'
              - 'functions/src/**'
              - 'functions/package*.json'
              - 'scripts/**'
              - 'package*.json'
              - 'tsconfig*.json'
              - 'jest.config.*'
            rules:
              - 'firestore.rules'
              - 'storage.rules'
              - 'tests/rules/**'
              - 'firebase*.json'
              - 'package*.json'

  unit-tests:
    name: Unit Tests
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.unit != 'false' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: @@node.version@@
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: @@commands.test@@

  rules-tests:
    name: Security Rules Tests
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.rules != 'false' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: @@node.version@@
          cache: "npm"

      - name: Setup Java (for the Firestore emulator)
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Install dependencies
        run: npm ci

      - name: Run security-rule tests (emulator)
        run: @@commands.testRules@@
