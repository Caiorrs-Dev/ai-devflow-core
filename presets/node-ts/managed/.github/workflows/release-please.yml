name: Release Please

# On every push to @@branches.production@@, opens or updates the release PR
# (version bump + CHANGELOG from Conventional Commits). Merging that PR tags the
# version and publishes the GitHub release.
#
# Secret RELEASE_PLEASE_TOKEN (optional, recommended): a fine-grained PAT or
# GitHub App token with contents and pull-requests write. With the default
# GITHUB_TOKEN, the release PR runs no CI (so required checks never report) and
# the published release starts no other workflow.
on:
  push:
    branches:
      - @@branches.production@@

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4.4.1
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
