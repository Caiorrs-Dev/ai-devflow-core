name: Commit Lint

# Local hooks can be skipped with `--no-verify`, so the same Conventional Commit
# rules run here. Squash merges turn the PR title into the commit message, so
# the title is validated too: that is the message release-please reads.
on:
  pull_request:
    branches:
      - @@branches.production@@
      - @@branches.integration@@
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

jobs:
  commitlint:
    name: Commitlint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          # Full history so the PR commit range can be resolved.
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: @@node.version@@
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint PR title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: printf '%s\n' "$PR_TITLE" | npx commitlint

      - name: Lint PR commits
        run: npx commitlint --from "${{ github.event.pull_request.base.sha }}" --to "${{ github.event.pull_request.head.sha }}"
