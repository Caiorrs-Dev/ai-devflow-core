name: Back-merge @@branches.production@@ into @@branches.integration@@

# release-please commits the version bump and CHANGELOG to
# @@branches.production@@. Without this job, the next promotion PR
# (@@branches.integration@@ -> @@branches.production@@) conflicts on those files.
#
# Trigger: every push to @@branches.production@@. Merging the release PR is a
# push made by the person who merged it, so it always fires. (A `release:
# published` trigger does not fire when release-please runs with GITHUB_TOKEN.)
#
# Secret BACK_MERGE_TOKEN: a PAT or GitHub App token allowed to bypass the
# @@branches.integration@@ branch protection. Without it the job uses
# GITHUB_TOKEN, which can push only to an unprotected branch. A push made with
# the PAT starts the @@branches.integration@@ workflows (deploy, if any); a push
# made with GITHUB_TOKEN does not.
#
# A conflicting merge fails the job instead of force-pushing.
on:
  push:
    branches:
      - @@branches.production@@
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: back-merge
  cancel-in-progress: false

jobs:
  back-merge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: @@branches.integration@@
          fetch-depth: 0
          token: ${{ secrets.BACK_MERGE_TOKEN || github.token }}

      - name: Merge @@branches.production@@ into @@branches.integration@@
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin @@branches.production@@
          if git merge-base --is-ancestor origin/@@branches.production@@ HEAD; then
            echo "@@branches.integration@@ already contains @@branches.production@@."
            exit 0
          fi
          git merge --no-edit origin/@@branches.production@@
          git push origin HEAD:@@branches.integration@@
