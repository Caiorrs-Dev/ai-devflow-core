name: Security Scan

# Dependency audit and secret scan. npm audit fails on high or critical
# vulnerabilities in the lockfile; gitleaks fails on a secret in the diff.
# Weekly schedule catches new advisories against the current lock.

on:
  pull_request:
  push:
    branches:
      - @@branches.integration@@
      - @@branches.production@@
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-scan-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    name: Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: @@node.version@@
      - name: Download gitleaks
        run: |
          version=8.30.1
          curl -fsSL -O "https://github.com/gitleaks/gitleaks/releases/download/v${version}/gitleaks_${version}_linux_x64.tar.gz"
          curl -fsSL -O "https://github.com/gitleaks/gitleaks/releases/download/v${version}/gitleaks_${version}_checksums.txt"
          grep "gitleaks_${version}_linux_x64.tar.gz" gitleaks_${version}_checksums.txt | sha256sum -c -
          tar -xzf gitleaks_${version}_linux_x64.tar.gz gitleaks
      # The action wrapper needs a paid license for organizations; the
      # gitleaks binary is MIT, so this downloads it directly. PRs scan the
      # diff against the base; the weekly schedule sweeps the full history.
      - name: Scan for leaked secrets
        if: github.event_name != 'push'
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            ./gitleaks detect --no-banner --redact --log-opts="${{ github.event.pull_request.base.sha }}..HEAD"
          else
            ./gitleaks detect --no-banner --redact
          fi
      - name: Audit dependencies
        run: @@commands.audit@@

      # Fails a PR that adds or upgrades a dependency with a known
      # vulnerability, a license the project forbids, or a scorecard drop.
      - name: Review dependency changes
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
