name: AI-flow Check

# Fails on drift between the project and its ai-devflow-core preset: managed
# files a release changed, locally edited managed files, missing skills, a
# stale lock. Run `npx github:Caiorrs-Dev/ai-devflow-core#v<version> sync`
# locally to fix it. The version is pinned by the last sync, so a core release
# never fails this workflow until the project syncs.

on:
  pull_request:
  push:
    branches:
      - @@branches.integration@@
      - @@branches.production@@
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ai-flow-check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: AI-flow Check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: @@node.version@@
      - name: Check ai-flow drift
        run: npx -y "git+https://github.com/Caiorrs-Dev/ai-devflow-core.git#v@@aiFlow.version@@" check --strict

  # The pipeline itself is code: lint the workflows and shell scripts the
  # project ships, so a YAML typo or a hook bug fails here and not on the
  # first run that needs it.
  pipeline-lint:
    name: Pipeline Lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install actionlint
        run: |
          version=1.7.7
          curl -fsSL -O "https://github.com/rhysd/actionlint/releases/download/v${version}/actionlint_${version}_linux_amd64.tar.gz"
          curl -fsSL -O "https://github.com/rhysd/actionlint/releases/download/v${version}/actionlint_${version}_checksums.txt"
          grep "actionlint_${version}_linux_amd64.tar.gz" actionlint_${version}_checksums.txt | sha256sum -c -
          tar -xzf actionlint_${version}_linux_amd64.tar.gz actionlint
      - name: Lint workflows and scripts
        # -shellcheck= disables actionlint's built-in shellcheck over every
        # run: block — it floods existing project workflows with style
        # findings (SC2086 and friends). Our own scripts and hooks are still
        # shellchecked by the explicit step below.
        run: |
          ./actionlint -shellcheck=
          files="$(git ls-files '*.sh')"
          if [ -n "$files" ]; then
            # word splitting on $files is the point: one shellcheck per file
            # shellcheck disable=SC2086
            shellcheck $files
          fi
