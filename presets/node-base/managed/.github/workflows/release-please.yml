name: Release Please

# On every push to @@branches.production@@, opens or updates the release PR
# (version bump + CHANGELOG from Conventional Commits). Merging that PR tags the
# version and publishes the GitHub release.
#
# Secret RELEASE_PLEASE_TOKEN (recommended): a fine-grained PAT or GitHub App
# token with contents and pull-requests write. With the default GITHUB_TOKEN,
# the release PR runs no CI (so required checks never report), the published
# release starts no other workflow, and the job fails unless the repository
# setting "Allow GitHub Actions to create and approve pull requests" is on.
on:
  push:
    branches:
      - @@branches.production@@

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
