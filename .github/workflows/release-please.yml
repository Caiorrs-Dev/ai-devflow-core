name: Release Please

# Opens or updates the release PR from Conventional Commits on main. Merging it
# tags vX.Y.Z, which projects pin (github:Caiorrs-Dev/ai-devflow-core#vX.Y.Z).
#
# GITHUB_TOKEN can open the release PR only when the repository setting
# "Allow GitHub Actions to create and approve pull requests" is on. Otherwise set
# RELEASE_PLEASE_TOKEN (fine-grained PAT or App token: contents and
# pull-requests write); it also makes CI run on the release PR.
on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
